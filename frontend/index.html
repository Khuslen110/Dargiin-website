<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050506" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("pr-theme");
          if (stored !== "light") document.documentElement.classList.add("dark");
        } catch (error) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <meta name="description" content="Иргэдийн нэгдсэн бүртгэлийн удирдлагын систем" />
    <title>Иргэдийн бүртгэл</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
